        <div class="actions center">${n<4?`<button class="btn" id="sumnext">다음 규칙</button>`:`<button class="btn alt" id="again">처음부터 다시 하기</button>`}</div>`,'chalk');
    }
  } else {
    const c=S5[i];
    body=panel(`상황 ${i+1} / ${S5.length}`,`
    <div class="sit"><span class="tag">${ICON[c.c]} ${CAT[c.c]}</span>${(st.combo||0)>=2?`<span class="combo">${st.combo} 콤보</span>`:''}
      <p class="big">${esc(c.t)}</p>
      ${last===undefined?`<div class="ox"><button class="o" data-v="1" aria-label="안전해요 O">O</button><button class="x" data-v="0" aria-label="위험해요 X">X</button></div><p class="lead">안전한 행동이면 O, 위험한 행동이면 X</p>`
      :`<div class="note ${last===c.a?'good':'bad'}" style="text-align:left;max-width:34em"><div><b>${last===c.a?'정답이에요!':'다시 생각해 봐요.'}</b> 이 행동은 ${c.a?'<b>안전해요(O)</b>':'<b>위험해요(X)</b>'}. ${c.why}</div></div>
       <button class="btn" id="next">${i+1<S5.length?'다음 상황':'결과 보기'}</button>`}
    </div>`);
  }
  const phase=i>=S5.length?1:0;
  app.innerHTML=`${stageHead(r)}${stepper(['상황 판단','방패 규칙'],phase,i<S5.length?`<span class="prog inline"><i style="width:${(i/S5.length)*100}%"></i></span>`:'')}${body}${footNav(5)}`;
  app.querySelectorAll('.ox button').forEach(b=>b.onclick=()=>{st.ans[i]=b.dataset.v==='1';const ok=st.ans[i]===S5[i].a;
    if(ok){st.combo=(st.combo||0)+1;SFX.good();award('s5_'+i,15);if(st.combo>=3)award('s5c_'+i,10);
      say(st.combo>=3?`${st.combo}연속 정답! 콤보 보너스 +10 XP!`:'정답! 방패가 더 튼튼해졌어요.','happy');}
    else{st.combo=0;SFX.bad();say('앗, 방패에 금이 갔어요! 설명을 읽고 기억해 둬요.','confused');}
    save();keep(s5);});
  const nx=document.getElementById('next'); if(nx) nx.onclick=()=>{st.i++;st.sum=0;SFX.tap();MSG=null;save();s5();if(st.i>=S5.length)complete(5);};
  const sn=document.getElementById('sumnext'); if(sn) sn.onclick=()=>{st.sum=(st.sum||0)+1;SFX.tap();save();s5();};
  const ag=document.getElementById('again'); if(ag) ag.onclick=()=>{S.s5={i:0,ans:[],combo:0,sum:0};MSG=null;save();s5();};
  bindGo();
}

/* ---------- S6 표현 ---------- */
const AI_CHAT={q:'우리 동네 자랑 글에 넣을, 갯벌에 대한 문장 두 개만 써 줘.',a:['갯벌에는 짱뚱어와 칠게 같은 생물이 많이 산다.','갯벌은 바닷물을 깨끗하게 해 주는 중요한 곳이다.']};
function expectedWho(t){t=t.trim();if(AI_CHAT.a.includes(t))return 'ai';if(DEFAULT_S6.some(d=>d.t===t))return 'me';return null;}
function chatBox(hl){return `<div class="ai-log"><div class="log-h">AI와 나눈 대화</div><div class="chat"><div class="q">${esc(AI_CHAT.q)}</div>
  <div class="a">${uni('')}<div class="bubble">${AI_CHAT.a.map(t=>`<span class="log-s ${hl===t?'hl':''}">${esc(t)}</span>`).join('')}</div></div></div></div>`;}
const CHECKS=['AI가 쓴 문장이 맞는 내용인지 책이나 자료로 확인했나요?','AI가 만든 부분과 내가 만든 부분을 구분해서 표시했나요?','내 생각이나 경험을 담은 문장이 들어 있나요?'];
function s6(){
  const r=ROOMS[5], st=S.s6; st.k=st.k||0;
  const lines=()=>st.lines.filter(l=>l.t.trim());
  const LS=lines(), n=LS.length;
  // 단계: 0 쓰기, 1..n 표시, n+1 미리보기, n+2..n+4 점검, n+5 게시
  const k=Math.min(st.k,n+5);
  const phase=k===0?0:k<=n?1:k===n+1?2:k<=n+4?3:4;
  const credit=()=>{const a=LS.filter(l=>l.w==='ai').length;return `이 글은 모두 ${n}문장 중 ${a}문장을 AI(${esc(st.tool)})의 도움을 받아 썼습니다. AI가 도운 부분은 파란색, 내가 쓴 부분은 초록색으로 표시했습니다.`;};
  const paper=()=>`<div class="preview"><h3>${esc(st.title||'제목 없음')}</h3><p>${LS.map(l=>`<span class="hl-${l.w}">${esc(l.t)}</span>`).join(' ')}</p>
     <div class="legend"><span><span class="hl-me">초록</span> 내가 쓴 부분</span><span><span class="hl-ai">파랑</span> AI가 도운 부분</span></div>
     <p class="credit"><b>AI 사용 밝히기</b> · ${credit()}</p></div>`;
  let body;
  if(k===0){
    body=panel('1단계 · 글 쓰기',`
      <p class="lead">글을 쓰다가 AI에게 도움을 받았어요. 아래는 AI와 나눈 대화예요.</p>
      ${chatBox()}
      <p class="lead">AI가 써 준 문장 두 개를 가져와서 아래 글을 완성했어요. 내 글로 바꿔 써도 좋아요. 다음 단계에서 문장마다 누가 썼는지 표시해요.</p>
      <div class="two"><input id="t6" value="${esc(st.title)}" aria-label="글 제목" placeholder="글 제목">
      <select id="tool6" aria-label="사용한 AI">${['챗GPT','클로드','제미나이','뤼튼','기타 AI'].map(x=>`<option ${x===st.tool?'selected':''}>${x}</option>`).join('')}</select></div>
      <div style="display:grid;gap:8px">${st.lines.map((l,i)=>`<div class="line"><span class="n">${i+1}</span><input id="l6_${i}" class="ltxt" data-i="${i}" value="${esc(l.t)}" aria-label="${i+1}번째 문장"><button class="x-del" data-del="${i}" aria-label="문장 지우기">×</button></div>`).join('')}</div>
      <div class="actions"><button class="btn alt sm" id="addl">+ 문장 추가</button><button class="btn alt sm" id="reset6">예시 글로 되돌리기</button><span style="flex:1"></span><button class="btn" id="next" ${n?'':'disabled'}>표시하러 가기 →</button></div>`);
  } else if(k<=n){
    const l=LS[k-1];
    body=panel(`2단계 · 문장 ${k} / ${n}`,`
      <p class="lead">AI와 나눈 대화와 비교해 보세요. 이 문장은 누가 썼나요?</p>
      ${chatBox(st.warn&&st.warn.k===k&&st.warn.e==='ai'?l.t.trim():null)}
      <p class="sentence">"${esc(l.t)}"</p>
      ${st.warn&&st.warn.k===k?`<div class="note bad"><div>${st.warn.e==='ai'?'이 문장은 AI 대답에 있던 문장이에요. 위 대화에서 노랗게 표시된 문장을 보세요.':'AI 대답에는 이 문장이 없어요. 내가 직접 쓴 문장이에요.'}</div></div>`:''}
      <div class="choice"><button class="btn green" data-w="me">내가 썼어요</button><button class="btn" data-w="ai" style="--rc:#2F6FE0">AI가 도왔어요</button></div>
      <div class="actions"><button class="btn alt sm" id="back">← 이전</button></div>`);
  } else if(k===n+1){
    body=panel('3단계 · 미리 보기',`${paper()}<div class="actions"><button class="btn alt sm" id="back">← 다시 표시하기</button><span style="flex:1"></span><button class="btn" id="next">점검하러 가기 →</button></div>`);
  } else if(k<=n+4){
    const c=k-n-2;
    body=panel(`4단계 · 게시 전 점검 ${c+1} / 3`,`
      <p class="sentence">${CHECKS[c]}</p>
      <div class="choice"><button class="btn green" id="yes">네, 했어요</button><button class="btn alt" id="fix">아직이에요</button></div>
      ${st.fix===c?`<div class="note bad"><div>${['AI가 쓴 문장을 교과서나 백과사전으로 확인하고 오세요. 틀린 내용이 있으면 1단계에서 고쳐요.','2단계로 돌아가 문장마다 누가 썼는지 표시해요.','1단계에서 내 경험이나 생각을 담은 문장을 한 줄 더 써 봐요.'][c]}</div></div>
        <div class="actions"><button class="btn alt sm" id="goFix">${c===1?'2단계로 가기':'1단계로 가기'}</button></div>`:''}`);
  } else {
    body=panel('게시 완료!',`${paper()}<div class="note good"><div>AI의 도움을 받은 부분을 숨기지 않고 밝혔어요. 이것이 <b>책임 있는 표현</b>이에요.</div></div>`);
  }
  app.innerHTML=`${stageHead(r)}${stepper(['쓰기','표시하기','미리 보기','점검','게시'],phase)}${body}${footNav(6)}`;
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f;};
  const go6=v=>{st.k=v;st.fix=-1;st.warn=null;MSG=null;save();s6();};
  if(k===0){
    document.getElementById('t6').oninput=e=>{st.title=e.target.value;save();};
    document.getElementById('tool6').onchange=e=>{st.tool=e.target.value;save();};
    app.querySelectorAll('.ltxt').forEach(inp=>inp.oninput=()=>{st.lines[+inp.dataset.i].t=inp.value;save();const b=document.getElementById('next');if(b)b.disabled=!lines().length;});
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{st.lines.splice(+b.dataset.del,1);save();keep(s6);});
    on('addl',()=>{st.lines.push({t:'',w:'me'});save();keep(s6);setTimeout(()=>{const el=document.getElementById('l6_'+(st.lines.length-1));el&&el.focus();},0);});
    on('reset6',()=>{st.lines=DEFAULT_S6.map(x=>({...x}));st.title='우리 동네 자랑하기';save();keep(s6);});
    on('next',()=>{st.lines=lines();SFX.tap();go6(1);});
  }
  app.querySelectorAll('.choice button[data-w]').forEach(b=>b.onclick=()=>{const e=expectedWho(LS[k-1].t);
    if(e&&b.dataset.w!==e){st.warn={k,e};SFX.bad();say(e==='ai'?'어? 그 문장은 제가 써 준 거예요! 대화를 다시 볼까요?':'그 문장은 제가 쓴 게 아니에요. 연구원님이 직접 쓴 문장이죠!','confused');save();keep(s6);return;}
    st.warn=null;LS[k-1].w=b.dataset.w;SFX.good();go6(k+1);});
  on('back',()=>go6(k-1));
  if(k>0) on('next',()=>{SFX.tap();go6(k+1);});
  on('yes',()=>{SFX.good();if(k===n+4){say('게시 완료! 솔직하게 밝혀 줘서 고마워요. 우리 멋진 팀이죠?','happy');st.k=k+1;st.fix=-1;save();award('s6',100);s6();complete(6);}else go6(k+1);});
  on('fix',()=>{st.fix=k-n-2;SFX.bad();save();keep(s6);});
  on('goFix',()=>go6(k-n-2===1?1:0));
  bindGo();
}

const SH={blue:['#6FA3F5','#2F63CF'],green:['#6FCB95','#26955A'],yellow:['#FFD86B','#E2A21A'],purple:['#B59CF0','#6F4FCB'],red:['#F58C7E','#D2453A']};
function defAv(){return{hair:'short',hc:'black',skin:'s1',shirt:'blue',face:'smile'};}

    pony:`<ellipse cx="160" cy="70" rx="20" ry="30" fill="url(#${p}h)" transform="rotate(28 160 70)"/><circle cx="146" cy="58" r="8" fill="${c[1]}"/>`,
    curly:'',short:''}[av.hair];
  const front={
    short:`<path d="M46 104 C40 56 70 34 100 34 C132 34 162 54 154 104 C150 86 140 74 126 70 C120 80 104 80 96 72 C84 82 64 82 58 76 C52 84 48 94 46 104 Z" fill="url(#${p}h)"/>`,
    bob:`<path d="M48 98 C50 56 74 40 100 40 C126 40 150 56 152 98 C140 80 122 72 100 72 C92 80 70 84 48 98 Z" fill="url(#${p}h)"/>`,
    pony:`<path d="M46 100 C42 56 70 36 100 36 C130 36 158 54 154 100 C144 80 128 70 106 68 C100 78 80 84 60 82 C54 88 48 94 46 100 Z" fill="url(#${p}h)"/>`,
    curly:[[56,70,16],[74,52,17],[98,44,18],[122,50,17],[142,66,16],[150,88,12],[50,90,12],[86,62,12],[112,62,12]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${p}h)"/>`).join('')
  }[av.hair];
  const eyeL=`<ellipse cx="81" cy="110" rx="6.5" ry="8" fill="#2A2020"/><circle cx="83.5" cy="106.5" r="2.4" fill="#fff"/>`;
  const eyeR=av.face==='wink'?`<path d="M112 110 Q119 104 126 110" stroke="#2A2020" stroke-width="4" fill="none" stroke-linecap="round"/>`:`<ellipse cx="119" cy="110" rx="6.5" ry="8" fill="#2A2020"/><circle cx="121.5" cy="106.5" r="2.4" fill="#fff"/>`;

    :`<path d="M89 128 Q100 138 111 128" stroke="#8E3B3B" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  return `<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="클레이 연구원 사진">

    <rect x="88" y="138" width="24" height="28" rx="10" fill="${k[2]}"/>
    ${back}
    <circle cx="48" cy="112" r="11" fill="url(#${p}k)"/><circle cx="152" cy="112" r="11" fill="url(#${p}k)"/>

function hash(s){let h=2166136261;for(const ch of String(s))h=Math.imul(h^ch.charCodeAt(0),16777619);return h>>>0;}
function idNo(){return 'AI-2026-'+String(hash((S.name||'')+(S.school||'')+(S.postId||'')) % 10000).padStart(4,'0');}
function barcode(seed){let h=hash(seed),x=0,out='';while(x<196){h=Math.imul(h^(h>>>13),1597334677)>>>0;const w=1+(h%3),gap=1+((h>>>4)%3);out+=`<rect x="${x}" y="0" width="${w}" height="34" fill="#1f2433"/>`;x+=w+gap;}return `<svg viewBox="0 0 200 34" preserveAspectRatio="none" aria-hidden="true">${out}</svg>`;}
function today(d){d=d?new Date(d):new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}

      ${d.pledge?`<p class="idc-pledge">"${esc(d.pledge)}"</p>`:''}

function myCardData(){
  return {name:S.name||'',school:S.school||'',klass:S.klass||'',pledge:S.pledge||'',av:Object.assign(defAv(),S.av||{}),
    level:lvInfo().name,xp:S.xp||0,badges:ROOMS.map(r=>!!S.done[r.id]),idno:idNo(),date:today()};
}

/* ---------- 게시판 (공유 db) ---------- */
let DBP=null, BOARD=[], BOARD_ST='loading', UNSUB=null, CAN_ADMIN=false;
function getDb(){if(!DBP) DBP=(window.claude&&claude.use?claude.use('db'):Promise.resolve(null)).catch(()=>null);return DBP;}
let BOARD_STARTING=false;
async function startBoard(){
  if(UNSUB||BOARD_STARTING||BOARD_ST==='off') return;BOARD_STARTING=true;
  const db=await getDb();
  if(!db){BOARD_ST='off';BOARD_STARTING=false;if(S.view==='board')board();return;}
  try{const u=await claude.use('user');CAN_ADMIN=u?await u.canEdit():false;}catch(e){}
  UNSUB=db.collection('board').orderBy('at','desc').limit(300).onSnapshot(snap=>{
    BOARD=snap.docs.map(d=>({id:d.id,...d.data()}));BOARD_ST='ok';if(S.view==='board')keep(board);
  },err=>{BOARD_ST='err';UNSUB=null;BOARD_STARTING=false;if(S.view==='board')board();});
}
async function postCard(){
  const msg=document.getElementById('postmsg'), btn=document.getElementById('post');
  if(!S.name){msg.textContent='이름을 먼저 적어 주세요.';document.getElementById('nm2').focus();return;}
  btn.disabled=true;msg.textContent='올리는 중…';
  const db=await getDb();
  if(!db){msg.textContent='지금 이 화면에서는 게시판을 쓸 수 없어요. 선생님이 공유한 링크로 로그인해서 열어 주세요.';btn.disabled=false;return;}
  try{
    if(!S.postId){S.postId='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);save();}
    const d=myCardData();
    await db.collection('board').doc(S.postId).set({...d,at:Date.now()});
    SFX.badge();confetti();toast('게시판에 올렸어요!');
    go('board');
  }catch(e){
    btn.disabled=false;
    msg.textContent=e&&e.code==='invalid_argument'?'게시판에 올릴 권한이 없어요. 선생님께 이 링크를 "참여자(Contributor)"로 공유해 달라고 말씀드려요.'
      :e&&e.code==='quota_exceeded'?'게시판이 가득 찼어요. 선생님께 말씀드려요.':'올리지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  }
}
function board(){
  startBoard();
  const mine=S.postId;
  let inner;
  if(BOARD_ST==='loading') inner=`<p class="lead center-t">게시판을 불러오는 중…</p>`;
  else if(BOARD_ST==='off') inner=`<div class="note"><div>지금 이 화면에서는 게시판을 볼 수 없어요.<br>선생님이 공유한 링크로 로그인해서 열어 주세요.</div></div>`;
  else if(BOARD_ST==='err') inner=`<div class="note bad"><div>게시판 연결이 끊겼어요.<br>페이지를 새로 고쳐 주세요.</div></div>`;
  else if(!BOARD.length) inner=`<div class="note"><div>아직 올라온 연구원증이 없어요.<br>첫 번째 연구원이 되어 보세요!</div></div>`;
  else inner=`<div class="board-grid">${BOARD.map((d,i)=>`<div class="pin ${d.id===mine?'mine':''}" style="--r:${((hash(d.id)%7)-3)*.8}deg">
      <span class="tack" aria-hidden="true"></span>${d.id===mine?'<span class="me-tag">내 연구원증</span>':''}
      ${idCard({...d,badges:Array.isArray(d.badges)?d.badges:[],xp:+d.xp||0},'b'+i)}
      ${CAN_ADMIN?`<button class="btn alt sm del" data-del="${esc(d.id)}">내리기</button>`:''}</div>`).join('')}</div>`;
  app.innerHTML=`
  <section class="stage-banner" style="--rc:#2F6FE0"><div class="stage-h"><div class="ic">${ICON.book}</div><div><small>우리 반 연구원들</small><h2>연구원증 게시판</h2></div></div></section>
  <div class="corkboard">
    <div class="cork-h"><b>모두 ${BOARD.length}명</b><span>정식 연구원 ${BOARD.filter(d=>Array.isArray(d.badges)&&d.badges.filter(Boolean).length===6).length}명</span></div>
    ${inner}
  </div>
  <div class="foot-nav"><button class="btn alt" data-go="finish">← 내 연구원증</button><button class="btn alt" data-go="map">연구소 지도</button></div>`;
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.del;b.outerHTML=`<span class="delq">정말 내릴까요? <button class="btn sm" data-yes="${esc(id)}" style="--rc:#D2453A">내리기</button> <button class="btn alt sm" data-no>취소</button></span>`;
    app.querySelector(`[data-yes="${CSS.escape(id)}"]`).onclick=async()=>{const db=await getDb();try{await db.collection('board').doc(id).delete();if(id===S.postId){S.postId='';save();}toast('내렸어요');}catch(e){toast('내리지 못했어요');}};
    app.querySelector('[data-no]').onclick=()=>keep(board);
  });
  bindGo();
}

/* ---------- 진행 기록 동기화 (태블릿 → 공유 db) ---------- */
let SYNC_T=null, LAST_SENT='';
function progressRecord(){
  return {sid:S.sid,name:S.name||'',school:S.school||'',klass:S.klass||'',xp:S.xp||0,level:lvInfo().name,
    done:ROOMS.map(r=>!!S.done[r.id]),view:S.view||'home',
    s1ok:!!S.done[1],s2fixed:!!S.s2.added,s3found:S3.filter((_,i)=>S.s3['f'+i]).length,
    s4:S4.map((_,i)=>S.s4['j'+i]===undefined?-1:S.s4['j'+i]),
    s5:S5.map((c,i)=>S.s5.ans[i]===undefined?-1:(S.s5.ans[i]===c.a?1:0)),
    s6ai:(S.s6.k>1)?(S.s6.lines||[]).filter(l=>l.t.trim()&&l.w==='ai').length:0,s6n:(S.s6.k>1)?(S.s6.lines||[]).filter(l=>l.t.trim()).length:0,
    posted:!!S.postId,pledge:S.pledge||'',start:S.start||Date.now()};
}
function scheduleSync(){
  if(!S.sid){S.sid='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);S.start=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  clearTimeout(SYNC_T);SYNC_T=setTimeout(syncNow,1500);
}
async function syncNow(){
  if(!(S.name||S.xp>0||doneCount()>0))return;
  const rec=progressRecord(),key=JSON.stringify(rec);if(key===LAST_SENT)return;
  const db=await getDb();if(!db)return;
  try{await db.collection('progress').doc(S.sid).set({...rec,at:Date.now()});LAST_SENT=key;}catch(e){}
}

/* ---------- 선생님 전체 현황판 ---------- */
let PROG=[], PROG_ST='loading', PUNSUB=null, DASH={today:true,sort:'name',open:''};
let PROG_STARTING=false;
async function startProg(){
  if(PUNSUB||PROG_STARTING||PROG_ST==='off')return;PROG_STARTING=true;
  const db=await getDb();
  if(!db){PROG_ST='off';PROG_STARTING=false;if(S.view==='dash')dash();return;}
  try{const u=await claude.use('user');CAN_ADMIN=u?await u.canEdit():false;}catch(e){}
  PUNSUB=db.collection('progress').orderBy('at','desc').limit(500).onSnapshot(snap=>{
    PROG=snap.docs.map(d=>({id:d.id,...d.data()}));PROG_ST='ok';if(S.view==='dash')keep(dash);
  },()=>{PROG_ST='err';PUNSUB=null;PROG_STARTING=false;if(S.view==='dash')dash();});
}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'방금':m<60?m+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전';}
function whereIs(v){const m=/^s(\d)$/.exec(v||'');return m?ROOMS[m[1]-1].name:{home:'첫 화면',map:'연구소 지도',finish:'연구원증',board:'게시판',teacher:'선생님 보기',dash:'현황판'}[v]||'-';}
function dash(){
  startProg();
  const t0=new Date();t0.setHours(0,0,0,0);
  let rows=PROG.filter(r=>!DASH.today||(r.at||0)>=t0.getTime());
  const nb=r=>(r.done||[]).filter(Boolean).length;
  const s4c=r=>(r.s4||[]).filter((v,i)=>v===S4[i].a).length, s5c=r=>(r.s5||[]).filter(v=>v===1).length;
  rows=[...rows].sort(DASH.sort==='name'?(a,b)=>(a.klass||'').localeCompare(b.klass||'')||(a.name||'').localeCompare(b.name||'','ko'):DASH.sort==='xp'?(a,b)=>(b.xp||0)-(a.xp||0):(a,b)=>nb(a)-nb(b));
  const N=rows.length, full=rows.filter(r=>nb(r)===6).length, avg=N?Math.round(rows.reduce((s,r)=>s+(r.xp||0),0)/N):0, posted=rows.filter(r=>r.posted).length;
  const live=rows.filter(r=>Date.now()-(r.at||0)<3*60000).length;
  // 문항 분석

/* ---- 문장마다 줄 나누기 ---- */
function splitLines(){
  app.querySelectorAll('.note > div, .lead, .risk-one span, .credit, .aithink p, .solo .meta, .pledge').forEach(el=>{
    if(el.dataset.split||el.querySelector('input,button,select,textarea'))return;
    let h=el.innerHTML;
    h=h.replace(/^(\s*<b>[^<]*[.!?]<\/b>)\s*/,'$1<br>');
    h=h.replace(/([.!?]["”)]?)\s+(?![^<]*>)(?=\S)/g,'$1<br>');
    el.innerHTML=h; el.dataset.split='1';
  });
}
new MutationObserver(splitLines).observe(app,{childList:true});

/* ---- 화면 크기 인식 · 자동 맞춤 ---- */
function fitScreen(){
  const w=innerWidth,h=innerHeight,de=document.documentElement;
  const touch=matchMedia('(pointer:coarse)').matches;
  let cls, z=1;
  if(w<600) cls='phone';
  else if(w<1100||(touch&&w<1400)) cls='tablet';
  else if(w<1700) cls='pc';
  else cls='board';
  if(cls==='board') z=Math.max(1,Math.min(w/1280,h/800,3));
  else if(cls==='pc' && h>900 && w>1400) z=Math.min(w/1280,h/800,1.3);
  de.dataset.screen=cls; de.dataset.touch=touch?'1':'0'; de.dataset.orient=h>w?'portrait':'landscape';
  document.body.style.zoom=z===1?'':String(z);
  const tp=document.querySelector('.top');de.style.setProperty('--topH',(tp?tp.offsetHeight:78)+'px');
  de.style.setProperty('--appH',(h/z)+'px'); de.style.setProperty('--vh1',(h/z/100)+'px'); de.style.setProperty('--vw1',(w/z/100)+'px');
}
let FIT_T=null;
addEventListener('resize',()=>{clearTimeout(FIT_T);FIT_T=setTimeout(fitScreen,120);});
addEventListener('orientationchange',()=>setTimeout(fitScreen,200));
fitScreen();
(function(){const b=document.getElementById('fs');if(!b)return;
  const upd=()=>{b.setAttribute('aria-label',document.fullscreenElement?'전체 화면 끝내기':'전체 화면');};
  b.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){toast('이 화면에서는 전체 화면을 쓸 수 없어요');}};
  document.addEventListener('fullscreenchange',()=>{upd();fitScreen();});})();
